# Sobe um PostgreSQL para desenvolvimento local.
# Uso: docker-compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: barbershop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: barbershop_user
      POSTGRES_PASSWORD: barbershop_pass
      POSTGRES_DB: barbershop_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbershop_user -d barbershop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
